<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#010D25">
  <meta name="description" content="30 Dias · Rastreador de hábitos by D.AUGUSTO">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="30 Dias">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>30 Dias · D.AUGUSTO</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // aplica o tema antes de desenhar (evita "piscar")
    try {
      var t = localStorage.getItem('habitos30:theme');
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <noscript><p style="padding:24px">Esta app precisa de JavaScript ativo.</p></noscript>

  <!-- Arranque (splash) -->
  <div id="splash" class="splash" aria-hidden="true">
    <img class="splash-logo" src="icons/logo-mark.png" alt="">
    <p class="splash-name">30 Dias</p>
    <div class="splash-bar"><i></i></div>
  </div>

  <!-- Onboarding e login (preenchidos por JS) -->
  <div id="onboarding" class="overlay" hidden role="dialog" aria-modal="true" aria-label="Boas-vindas"></div>
  <div id="auth" class="overlay" hidden role="dialog" aria-modal="true" aria-label="Conta"></div>

  <!-- App -->
  <div id="app" class="shell" hidden>
    <div id="update" class="update" hidden role="status">
      <span>Nova versão disponível</span>
      <button type="button" id="updateBtn">Atualizar</button>
    </div>
    <header class="top">
      <div class="brand"><img src="icons/logo-mark.png" alt="D.AUGUSTO" class="brand-logo"><span>30 Dias</span></div>
      <span id="syncChip" class="sync" hidden></span>
    </header>

    <main id="views">
      <section id="view-today" class="view" data-view="today" aria-label="Hoje"></section>
      <section id="view-progress" class="view" data-view="progress" aria-label="Progresso" hidden></section>
      <section id="view-achievements" class="view" data-view="achievements" aria-label="Conquistas" hidden></section>
      <section id="view-profile" class="view" data-view="profile" aria-label="Perfil" hidden></section>
    </main>

    <button class="fab" id="addBtn" type="button" aria-label="Novo hábito">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <nav class="tabbar" aria-label="Navegação principal">
      <button type="button" data-tab="today" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg><span>Hoje</span>
      </button>
      <button type="button" data-tab="progress">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-6M12 20V5M19 20v-9"/></svg><span>Progresso</span>
      </button>
      <button type="button" data-tab="achievements">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="6"/><path d="M8.5 14.2L7 22l5-3 5 3-1.5-7.8"/></svg><span>Conquistas</span>
      </button>
      <button type="button" data-tab="profile">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6.5 8-6.5s8 2.5 8 6.5"/></svg><span>Perfil</span>
      </button>
    </nav>
  </div>

  <!-- Criar / editar hábito -->
  <dialog id="habitDlg" aria-labelledby="hf-title">
    <form class="sheet" id="hf" novalidate>
      <div class="grabber"></div>
      <h3 id="hf-title">Novo hábito</h3>
      <label class="field"><span>Nome</span>
        <input id="hf-name" type="text" maxlength="40" required autocomplete="off" placeholder="Ex.: Beber 2L de água">
      </label>
      <p class="form-error" id="hf-err" role="alert"></p>
      <div class="field"><span id="hf-ico-l">Ícone</span><div class="picker" id="hf-emoji" role="radiogroup" aria-labelledby="hf-ico-l"></div></div>
      <div class="field"><span id="hf-col-l">Cor</span><div class="picker colors" id="hf-color" role="radiogroup" aria-labelledby="hf-col-l"></div></div>
      <div class="field">
        <label class="switch-row"><span>Lembrete diário</span><input id="hf-rem-on" type="checkbox" role="switch"></label>
        <input id="hf-rem" type="time" value="20:00" aria-label="Hora do lembrete" hidden>
        <p class="muted small" id="hf-rem-note"></p>
      </div>
      <div class="actions">
        <button type="button" class="btn ghost" id="hf-cancel">Cancelar</button>
        <button type="submit" class="btn primary" id="hf-save">Criar hábito</button>
      </div>
    </form>
  </dialog>

  <!-- Detalhe do hábito -->
  <dialog id="detailDlg" aria-label="Detalhe do hábito"><div class="sheet" id="detail"></div></dialog>

  <!-- Lista genérica (hábitos arquivados) -->
  <dialog id="listDlg" aria-label="Lista"><div class="sheet" id="listBody"></div></dialog>

  <!-- Pergunta / confirmação -->
  <dialog id="askDlg" class="center" aria-labelledby="ask-t">
    <div class="sheet">
      <h3 id="ask-t"></h3>
      <p class="muted" id="ask-p"></p>
      <div class="actions col" id="ask-b"></div>
    </div>
  </dialog>

  <!-- Medalha desbloqueada -->
  <dialog id="unlockDlg" class="center" aria-labelledby="ul-t">
    <div class="sheet unlock">
      <p class="eyebrow">Medalha desbloqueada!</p>
      <div class="medal-disc big on" id="ul-disc" aria-hidden="true"><span id="ul-icon"></span></div>
      <h3 id="ul-t"></h3>
      <p class="muted" id="ul-d"></p>
      <button type="button" class="btn primary" id="ul-ok">Continuar</button>
    </div>
  </dialog>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
